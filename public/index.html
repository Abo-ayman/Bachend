 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الزوار</title>
<style>
  body { font-family: Tahoma, Arial, sans-serif; background:#0b1220; color:#e6edf3; margin:0; padding:24px; }
  h1 { font-size:20px; margin-bottom:16px; }
  .login { max-width:320px; margin:80px auto; background:#111a2b; padding:24px; border-radius:12px; }
  .login input { width:100%; padding:10px; margin:8px 0; border-radius:6px; border:1px solid #2a3850; background:#0b1220; color:#fff; box-sizing:border-box; }
  .login button, .refresh { width:100%; padding:10px; border-radius:6px; border:none; background:#2f81f7; color:#fff; cursor:pointer; font-size:14px; }
  table { width:100%; border-collapse:collapse; margin-top:16px; font-size:13px; }
  th, td { padding:8px; border-bottom:1px solid #223047; text-align:right; }
  th { color:#9fb3c8; }
  .stats { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .stat-card { background:#111a2b; padding:12px 16px; border-radius:10px; min-width:120px; }
  .stat-card .num { font-size:22px; font-weight:bold; }
  .stat-card .label { font-size:12px; color:#9fb3c8; }
  #app { display:none; max-width:1000px; margin:0 auto; }
  .error { color:#ff6b6b; font-size:13px; margin-top:8px; }
</style>
</head>
<body>

<div class="login" id="loginBox">
  <h1>دخول لوحة الإدارة</h1>
  <input type="password" id="pwd" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
  <div class="error" id="loginError"></div>
</div>

<div id="app">
  <h1>زوار الموقع</h1>
  <div class="stats" id="stats"></div>
  <button class="refresh" onclick="loadVisitors()">تحديث</button>
  <table>
    <thead>
      <tr>
        <th>الوقت</th><th>IP</th><th>الدولة/المدينة</th><th>الجهاز</th><th>النظام</th><th>المتصفح</th><th>اللغة</th><th>المصدر</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
  // عدّل هذا إلى رابط الـ backend بعد نشره (لا تتركه localhost في الإنتاج)
  const API_BASE = 'https://bachend-3iij.onrender.com'; 
  let password = '';

  function login() {
    password = document.getElementById('pwd').value;
    fetch(`${API_BASE}/admin/stats`, { headers: { 'x-admin-password': password } })
      .then(r => { if (!r.ok) throw new Error('كلمة المرور غير صحيحة'); return r.json(); })
      .then(() => {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        loadStats();
        loadVisitors();
      })
      .catch(e => { document.getElementById('loginError').textContent = e.message; });
  }

  function loadStats() {
    fetch(`${API_BASE}/admin/stats`, { headers: { 'x-admin-password': password } })
      .then(r => r.json())
      .then(data => {
        document.getElementById('stats').innerHTML = `
          <div class="stat-card"><div class="num">${data.total}</div><div class="label">إجمالي الزيارات</div></div>
          <div class="stat-card"><div class="num">${data.last24h}</div><div class="label">آخر 24 ساعة</div></div>
        `;
      });
  }

  function loadVisitors() {
    fetch(`${API_BASE}/admin/visitors?limit=50`, { headers: { 'x-admin-password': password } })
      .then(r => r.json())
      .then(data => {
        document.getElementById('rows').innerHTML = data.rows.map(v => `
          <tr>
            <td>${v.created_at}</td>
            <td>${v.ip || '-'}</td>
            <td>${(v.country || '-') + ' / ' + (v.city || '-')}</td>
            <td>${v.device_type || '-'}</td>
            <td>${v.os || '-'}</td>
            <td>${v.browser || '-'}</td>
            <td>${v.language || '-'}</td>
            <td>${v.referrer || '-'}</td>
          </tr>
        `).join('');
      });
  }
</script>
</body>
</html>
